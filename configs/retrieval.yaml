bm25:
  model: Qdrant/bm25
  k: 1.2
  b: 0.75
  # Mean BM25 length (stemmed, stopwords removed) of child embedding texts, measured
  # with `python -m src.retrieval.bm25 --avg-len` (24 filings: 113.5). fastembed's
  # default of 256 would under-penalise long chunks. Full corpus (726 filings): 114.8 -- kept at
  # 113.5 so results stay comparable across scaling stages (1% difference, negligible).
  avg_len: 113.5

hybrid:
  dense_top_k: 30        # candidates from each side before fusion
  sparse_top_k: 30
  top_k: 10              # returned after fusion
  fusion: relative       # relative (score-normalised, weighted by alpha) | rrf
  alpha: 0.3             # weight of the dense side; selected on the dev split (fusion_sweep)
  rrf_k: 60

rerank:
  model: BAAI/bge-reranker-base   # 278M params; fp16 on GPU ~0.55 GB
  fp16: true
  batch_size: 16                 # 60 pairs: 439 ms / 906 MiB (batch 32: 939 ms / 1218 MiB)
  linearize_tables: true         # rows as sentences for the cross-encoder (see src/retrieval/linearize.py)
  top_n: 60                      # keep the full re-scored list; evaluation cuts to top 10
  default_pool: bm25_60          # chosen on dev (MRR); ties union_45_15 (paired bootstrap)
  pools:                         # candidates handed to the cross-encoder
    bm25_60: {bm25: 60}
    union_30_30: {bm25: 30, dense: 30}
    union_45_15: {bm25: 45, dense: 15}
    union_45_hyde15: {bm25: 45, hyde_dense: 15}   # Phase 15: HyDE dense candidates
