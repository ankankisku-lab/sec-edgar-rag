ragas:
  # Judge = FREE tier only (user requirement). Groq's free plan has no billing attached, so the
  # key cannot be charged; the guards below also keep every run bounded and resumable.
  judge:
    provider: groq
    model: openai/gpt-oss-120b             # strongest free Groq model here; not Qwen, so no self-grading
    reasoning_effort: low                  # reasoning model: keep hidden reasoning tokens (free TPD) small
    base_url: https://api.groq.com/openai/v1   # OpenAI-compatible endpoint
    api_key_env: GROQ_API_KEY
  requests_per_minute: 20         # pacing; per-minute token limits are handled by waiting
  max_calls_per_run: 600          # hard cap per invocation (full G5+G6 run ~490 calls); stops cleanly when reached
  rate_limit_max_waits: 12        # consecutive per-minute 429 waits before giving up on a call
  answer_relevancy_strictness: 1  # generated questions per answer (ragas default 3 = 3x the calls)
  embeddings_model: BAAI/bge-small-en-v1.5   # local, free (answer relevancy similarity)
  cache_dir: data/eval/cache/ragas            # every judge call cached: re-runs and resumes are free
