<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC Filings Chat</title>
<!-- Served by the API at GET /. Self-contained (no CDN): works offline, like the rest of the stack. -->
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --text: #15171c; --muted: #5d6471; --faint: #8b919c;
  --border: #e2e5ea; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e3f3f1;
  --user: #1d2129; --user-ink: #f7f8fa;
  --ok: #17803a; --ok-soft: #e7f5ec; --warn: #95590a; --warn-soft: #fdf3e1; --bad: #b42318; --bad-soft: #fdecea;
  --hl: #fff1b8; --hl-row: #fbf8ea;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --panel: #1a1d23; --panel-2: #22262d; --text: #e7e9ee; --muted: #a0a7b3; --faint: #737a86;
    --border: #2c3139; --accent: #2bb3a3; --accent-ink: #0b1513; --accent-soft: #15302d;
    --user: #2a2f38; --user-ink: #eef0f4;
    --ok: #4cc47a; --ok-soft: #15291d; --warn: #e3a64a; --warn-soft: #2d2413; --bad: #f07b6f; --bad-soft: #321b19;
    --hl: #4d4116; --hl-row: #262419;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh;
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; width: 100%; }

/* header */
header { background: var(--panel); border-bottom: 1px solid var(--border); flex: none; }
header .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand small { font-weight: 450; color: var(--muted); margin-left: 6px; }
.status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); margin-left: auto;
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); animation: pulse 1.4s infinite; }
.dot.bad { background: var(--bad); }
@keyframes pulse { 50% { opacity: .35; } }
.ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 13px;
  color: var(--muted); cursor: pointer; white-space: nowrap; }
.ghost:hover { background: var(--panel-2); color: var(--text); }

/* conversation */
main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
#log { padding: 24px 0 32px; display: flex; flex-direction: column; gap: 22px; }
.turn { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px; }
.q { align-self: flex-end; max-width: 85%; background: var(--user); color: var(--user-ink); padding: 9px 14px;
  border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.a { background: var(--panel); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px;
  padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.answer { overflow-wrap: anywhere; font-size: 15.5px; }
.answer.refused { color: var(--muted); }
.answer p { margin: 0 0 8px; } .answer > :last-child { margin-bottom: 0; }
.answer ul, .answer ol { margin: 4px 0 8px; padding-left: 22px; } .answer li { margin: 3px 0; }
.cite { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
  padding: 0 4px; margin: 0 1px; border: 0; border-radius: 5px; background: var(--accent-soft); color: var(--accent);
  font-size: 11.5px; font-weight: 650; vertical-align: 2px; cursor: pointer; font-variant-numeric: tabular-nums; }
.cite:hover { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.note { margin-top: 12px; font-size: 13.5px; border-radius: 10px; padding: 9px 12px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.muted { background: var(--panel-2); color: var(--muted); }
.note.bad { background: var(--bad-soft); color: var(--bad); display: flex; gap: 12px; align-items: center; }
.note.bad .ghost { margin-left: auto; color: var(--bad); border-color: currentColor; }
.block-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint);
  margin: 14px 0 6px; }
.subq { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.calc { font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--muted);
  background: var(--panel-2); border-radius: 8px; padding: 6px 10px; overflow-x: auto; }

/* sources */
details.sources { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
details.sources > summary { cursor: pointer; font-size: 13.5px; color: var(--muted); list-style: none; user-select: none; }
details.sources > summary::-webkit-details-marker { display: none; }
details.sources > summary::before { content: "▸"; display: inline-block; width: 14px; transition: transform .15s; }
details.sources[open] > summary::before { transform: rotate(90deg); }
.src-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.src { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: start; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px; transition: background .4s, border-color .4s; }
.src:not(.cited) { opacity: .62; }
.src.flash { background: var(--accent-soft); border-color: var(--accent); opacity: 1; }
.src-n { width: 22px; height: 22px; border-radius: 6px; background: var(--panel-2); color: var(--muted);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 650; }
.src.cited .src-n { background: var(--accent-soft); color: var(--accent); }
.src-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.tick { font-weight: 650; }
.form { font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
.period { color: var(--text); }
.section { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.src-link { font-size: 12.5px; white-space: nowrap; text-decoration: none; padding-top: 1px; }
.src-link:hover { text-decoration: underline; }

/* numbers in the answer, traced to the cell they were quoted from */
.num { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  border-bottom: 1.5px dotted var(--accent); border-radius: 2px; }
.num:hover, .num:focus-visible { background: var(--hl); outline: none; }
.num.off { border-bottom-color: var(--warn); }

/* passage behind a citation */
details.passage { grid-column: 1 / -1; margin-top: 2px; }
details.passage summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; user-select: none; width: max-content; }
details.passage summary::-webkit-details-marker { display: none; }
details.passage summary::before { content: "▸"; display: inline-block; width: 12px; transition: transform .15s; }
details.passage[open] summary::before { transform: rotate(90deg); }
.pv { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; max-height: 420px; overflow: auto; }
.pv-links { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.pv-links a { text-decoration: none; font-weight: 600; }
.pv-links a:hover { text-decoration: underline; }
.pv-links a.sec { font-weight: 450; font-size: 12px; }
.pv-links .fine { color: var(--faint); font-size: 11.5px; }
.pv-text { font-size: 13px; color: var(--muted); margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pv-text.cap { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.pv-wrap { overflow-x: auto; margin: 0 0 8px; }
.pv-table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; width: max-content; min-width: 100%; }
.pv-table td { padding: 3px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.pv-table td:first-child { white-space: normal; min-width: 180px; max-width: 360px; }
.pv-table td.n { text-align: right; }
.pv-table tr.hdr td { color: var(--faint); font-weight: 600; font-size: 12px; }
.pv-table tr.hl-row td { background: var(--hl-row); }
.pv-table td.hl, mark.hl { background: var(--hl); color: var(--text); font-weight: 650; border-radius: 3px; }
mark.hl { padding: 0 2px; }
.focus { outline: 2px solid var(--accent); outline-offset: -2px; animation: focuspulse 1.6s ease-out; }
@keyframes focuspulse { 0%, 40% { outline-color: var(--accent); } 100% { outline-color: transparent; } }

.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; font-size: 12.5px; color: var(--faint);
  font-variant-numeric: tabular-nums; }
.meta button { background: none; border: 0; padding: 0; color: var(--faint); cursor: pointer; font-size: 12.5px;
  text-decoration: underline dotted; text-underline-offset: 3px; }
.meta button:hover, .meta a:hover { color: var(--text); }
.meta a { color: var(--faint); }

/* pending */
.pending { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
  background: var(--accent); animation: bounce 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

/* empty state */
.empty { text-align: center; padding: 8vh 8px 0; }
.empty h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 8px; }
.empty p { color: var(--muted); max-width: 540px; margin: 0 auto 22px; }
.examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
.example { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px;
  cursor: pointer; font-size: 14px; box-shadow: var(--shadow); text-align: left; }
.example:hover { border-color: var(--accent); }
.example span { display: block; font-size: 12px; color: var(--faint); margin-bottom: 2px; }

/* composer */
footer { flex: none; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 10px 0 14px; }
.composer { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
.composer:focus-within { border-color: var(--accent); }
textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
  font: inherit; max-height: 160px; padding: 5px 0; min-width: 0; }
textarea::placeholder { color: var(--faint); }
#send { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent);
  color: var(--accent-ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
#send:disabled { opacity: .35; cursor: default; }
.hints { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 7px;
  font-size: 12px; color: var(--faint); padding: 0 4px; }
.hints label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
.hints input { accent-color: var(--accent); margin: 0; }
#count.over { color: var(--bad); }

@media (max-width: 560px) {
  .brand small { display: none; }
  .q { max-width: 92%; }
  .examples { grid-template-columns: 1fr; }
  .src { grid-template-columns: 22px 1fr; }
  .src-link { grid-column: 2; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">SEC Filings Chat<small>Nasdaq-100 · 10-K &amp; 10-Q</small></div>
    <div class="status" id="status" title=""><span class="dot" id="dot"></span><span id="status-text">Connecting…</span></div>
    <button class="ghost" id="clear" type="button">Clear chat</button>
  </div>
</header>

<main id="scroller"><div class="wrap" id="log" aria-live="polite"></div></main>

<footer>
  <div class="wrap">
    <form class="composer" id="form">
      <textarea id="input" rows="1" maxlength="1000" placeholder="Ask about a company's filings, e.g. Apple's operating income in fiscal 2025 Q3"
                aria-label="Question"></textarea>
      <button id="send" type="submit" aria-label="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="hints">
      <label><input type="checkbox" id="split" checked> Split comparisons into sub-questions</label>
      <span><span id="count"></span>Each question is answered on its own · Enter to send, Shift+Enter for a new line</span>
    </div>
  </div>
</footer>

<script>
const STORE = "sec-rag-chat-v1";
const REFUSAL = "do not contain this information";
const MAX_CHARS = 1000;
const PHOENIX = `${location.protocol}//${location.hostname}:6006`;
const EXAMPLES = [
  ["Single figure", "What was Apple's operating income in fiscal 2025 Q3?"],
  ["Comparison", "Compare Apple's net sales in fiscal 2025 Q3 and fiscal 2026 Q3."],
  ["Annual report", "What was NVIDIA's total revenue in fiscal 2026?"],
  ["Narrative", "What supply chain risks does NVIDIA describe in its 10-K?"],
];

const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), scroller = $("scroller");
let history = [];
let busy = false, ready = false, pending = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const secs = (ms) => (ms / 1000).toFixed(1) + " s";

function loadHistory() {
  try { history = JSON.parse(localStorage.getItem(STORE)) || []; } catch { history = []; }
}
function saveHistory() {
  try { localStorage.setItem(STORE, JSON.stringify(history.slice(-50))); } catch { /* storage unavailable */ }
}

// ------------------------------------------------------------ rendering
function render() {
  if (!history.length && !pending) {
    log.innerHTML = `<div class="empty">
      <h1>Ask about Nasdaq-100 filings</h1>
      <p>Answers come only from each company's latest 10-K and 10-Q filings. Every figure is cited and
         checked against its source; click a number to see the table cell it was quoted from. Name the
         company and fiscal period for the best results.</p>
      <div class="examples">${EXAMPLES.map(([k, q]) =>
        `<button class="example" type="button" data-q="${esc(q)}"><span>${esc(k)}</span>${esc(q)}</button>`).join("")}
      </div></div>`;
    return;
  }
  log.innerHTML = history.map(turnHTML).join("") + (pending ? turnHTML(pending) : "");
}

function turnHTML(e) {
  return `<section class="turn" id="t-${e.id}">
    <div class="q">${esc(e.q)}</div>
    <div class="a">${e.pending ? pendingHTML(e) : e.err ? errorHTML(e) : answerHTML(e)}</div>
  </section>`;
}

function pendingHTML(e) {
  return `<div class="pending"><span class="dots"><span></span><span></span><span></span></span>
    <span>Searching filings and writing the answer… <span id="elapsed">${Math.floor((Date.now() - e.ts) / 1000)}</span> s</span></div>`;
}

function errorHTML(e) {
  return `<div class="note bad" style="margin-top:0"><span>${esc(e.err)}</span>
    <button class="ghost" type="button" data-retry="${e.id}">Retry</button></div>`;
}

function answerHTML(e) {
  const r = e.res, id = e.id;
  const nums = new Set(r.sources.map((s) => s.n));
  const cited = new Set([...r.answer.matchAll(/\[(\d+)\]/g)].map((m) => +m[1]).filter((n) => nums.has(n)));
  const refused = r.answer.toLowerCase().includes(REFUSAL);
  const numbers = r.numbers || [];
  const body = formatAnswer(markNumbers(r.answer, numbers))
    .replace(/(\d+)/g, (m, k) => {
      const n = numbers[+k];
      return `<button class="num${n.in_cited_source ? "" : " off"}" type="button" data-num="${id}:${k}" title="${esc(numberTitle(n))}">`;
    })
    .replace(//g, "</button>")
    .replace(/\[(\d+)\]/g, (m, n) =>
      nums.has(+n) ? `<button class="cite" type="button" data-src="s-${id}-${n}" title="Show source ${n}">${n}</button>` : m);
  const hasNumbers = /\d/.test(r.answer.replace(/\[\d+\]/g, ""));

  let html = `<div class="answer${refused ? " refused" : ""}">${body}</div>`;

  if (refused) {
    html += `<div class="note muted">The retrieved filings didn't contain this. Try naming the company and the exact
      fiscal period (e.g. "fiscal 2025 Q3" or "fiscal 2025" for the annual report).</div>`;
  } else if (r.unverified_numbers.length) {
    html += `<div class="note warn">⚠ Not found in the sources, treat with care:
      <b>${r.unverified_numbers.map(esc).join(", ")}</b></div>`;
  }

  const chips = [];
  if (!refused && hasNumbers && !r.unverified_numbers.length) chips.push(`<span class="chip ok">✓ Every number found in a source</span>`);
  if (cited.size) chips.push(`<span class="chip">${cited.size} of ${r.sources.length} sources cited</span>`);
  if (chips.length) html += `<div class="chips">${chips.join("")}</div>`;

  if (r.sub_questions.length > 1) {
    html += `<div class="block-title">Split into ${r.sub_questions.length} searches</div>
      <ul class="subq">${r.sub_questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>`;
  }
  if (r.calculations.length) {
    html += `<div class="block-title">Calculated</div>` + r.calculations.map((c) =>
      `<div class="calc">${esc(c.expression)} = ${esc(c.text ?? c.value)}</div>`).join("");
  }

  if (r.sources.length) {
    html += `<details class="sources" id="d-${id}"><summary>Sources (${r.sources.length})</summary><div class="src-list">
      ${r.sources.map((s) => sourceHTML(s, id, cited.has(s.n), numbers)).join("")}</div></details>`;
  }

  const lat = r.latency_ms || {};
  html += `<div class="meta"><span>${secs(lat.total)} total</span>`;
  if (lat.retrieval != null) html += `<span>retrieval ${secs(lat.retrieval)}</span>`;
  if (lat.generation != null) html += `<span>generation ${secs(lat.generation)}</span>`;
  if (r.trace_id) html += `<button type="button" data-copy="${esc(r.trace_id)}" title="Copy the Phoenix trace id">trace ${esc(r.trace_id.slice(0, 8))}…</button>
    <a href="${PHOENIX}" target="_blank" rel="noopener">Phoenix ↗</a>`;
  return html + `</div>`;
}

// Plain text from the LLM -> paragraphs and bullet/numbered lists (escaped first; no other markup).
function formatAnswer(text) {
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push(`<${list.tag}>${list.items.join("")}</${list.tag}>`); list = null; } };
  for (const raw of esc(text.trim()).split("\n")) {
    const line = raw.trim().replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const m = line.match(/^(?:([-*•])|(\d{1,2})[.)])\s+(.*)$/);
    if (m) {
      const tag = m[1] ? "ul" : "ol";
      if (!list || list.tag !== tag) { close(); list = { tag, items: [] }; }
      list.items.push(`<li>${m[3]}</li>`);
    } else {
      close();
      if (line) out.push(`<p>${line}</p>`);
    }
  }
  close();
  return out.join("");
}

function sourceHTML(s, id, cited, numbers) {
  const ticker = (s.filing_id || "").split("_")[0];
  const section = (s.section || "").split(" > ").join(" › ");
  const hl = highlightsFor(s.n, numbers);
  const count = hl.cells.size + [...hl.text.values()].reduce((a, t) => a + t.size, 0);
  const passage = s.passage && s.passage.blocks && s.passage.blocks.length
    ? `<details class="passage" id="p-${id}-${s.n}"><summary>Show passage${count ? ` · ${count} quoted` : ""}</summary>
        ${filingLinksHTML(s, numbers)}<div class="pv">${passageHTML(s.passage, id, s.n, hl)}</div></details>` : "";
  return `<div class="src${cited ? " cited" : ""}" id="s-${id}-${s.n}">
    <div class="src-n">${s.n}</div>
    <div><div class="src-top"><span class="tick">${esc(ticker)}</span><span class="form">${esc(s.form)}</span>
      <span class="period">${esc(s.period)}</span></div>
      <div class="section">${esc(section)}</div></div>
    ${s.url ? `<a class="src-link" href="${esc(s.url)}" target="_blank" rel="noopener">SEC filing ↗</a>` : ""}
    ${passage}
  </div>`;
}

// ------------------------------------------------------------ citations: number -> quoted cell
// Private-use characters mark each located number before escaping and formatting; they are
// swapped for <button class="num"> afterwards, so offsets from the API stay exact.
function markNumbers(answer, numbers) {
  let t = answer;
  numbers.map((n, k) => ({ ...n, k }))
    .filter((n) => n.status === "cell" || n.status === "text")
    .sort((a, b) => b.start - a.start)
    .forEach((n) => { t = t.slice(0, n.start) + "" + n.k + "" + t.slice(n.start, n.end) + "" + t.slice(n.end); });
  return t;
}

function numberTitle(n) {
  const where = n.cells.length
    ? n.cells.slice(0, 2).map((c) => `Source ${c.source}: ${c.label}${c.column ? " · " + c.column : ""}`).join("\n")
    : n.text.slice(0, 2).map((t) => `Source ${t.source}: quoted in the text`).join("\n");
  return where + (n.in_cited_source ? "" : "\nNot in the source this sentence cites") +
    "\nClick to show it (the passage links to the original filing)";
}

// Links into the original filing: our copy with the spot highlighted, and sec.gov scrolled to
// the iXBRL fact where the number is tagged.
function filingLinksHTML(s, numbers) {
  if (!s.filing_id) return "";
  const seen = new Set(), links = [];
  for (const n of numbers || []) {
    for (const m of [...n.cells, ...n.text]) {
      const f = m.source === s.n && m.filing;
      if (!f || seen.has(f.node)) continue;
      seen.add(f.node);
      const href = `/filing/${encodeURIComponent(s.filing_id)}?node=${f.node}&mark=${encodeURIComponent(n.token)}#sec-rag-target`;
      const tip = `Open the original ${s.form || "filing"} with ${n.token} highlighted` + (f.unique ? "" : " (best of several matches)");
      let html = `<a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(tip)}">${esc(n.token)}${f.unique ? "" : "*"} ↗</a>`;
      if (f.fact_id && s.url) html += ` <a class="sec" href="${esc(s.url)}#${esc(f.fact_id)}" target="_blank" rel="noopener"
        title="sec.gov, scrolled to the tagged fact ${esc(f.concept || "")}">sec.gov</a>`;
      links.push(html);
    }
  }
  if (!links.length) return "";
  const ambiguous = links.some((l) => l.includes("* ↗"));
  return `<div class="pv-links">In the original filing: ${links.join(" · ")}${ambiguous ? ` <span class="fine">* best match</span>` : ""}</div>`;
}

function highlightsFor(sourceN, numbers) {
  const cells = new Set(), rows = new Set(), text = new Map();
  for (const n of numbers || []) {
    for (const c of n.cells) if (c.source === sourceN) { cells.add(`${c.block}-${c.row}-${c.col}`); rows.add(`${c.block}-${c.row}`); }
    for (const t of n.text) if (t.source === sourceN) (text.get(t.block) || text.set(t.block, new Set()).get(t.block)).add(t.token);
  }
  return { cells, rows, text };
}

const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const isHeaderRow = (row) => row.slice(1).some((c) => c.trim()) &&
  row.slice(1).every((c) => !/\d/.test(c) || /^\s*(19|20)\d\d\s*$/.test(c) || /[A-Za-z]{3}/.test(c));

function passageHTML(p, id, n, hl) {
  return p.blocks.map((b, bi) => {
    if (b.type === "table") {
      const rows = b.rows.map((row, ri) => {
        const cls = [isHeaderRow(row) ? "hdr" : "", hl.rows.has(`${bi}-${ri}`) ? "hl-row" : ""].filter(Boolean).join(" ");
        const cells = row.map((cell, ci) => {
          const text = cell.replace(/\*\*/g, "");
          const c = [ci > 0 && /\d/.test(text) ? "n" : "", hl.cells.has(`${bi}-${ri}-${ci}`) ? "hl" : ""].filter(Boolean).join(" ");
          return `<td id="c-${id}-${n}-${bi}-${ri}-${ci}"${c ? ` class="${c}"` : ""}>${esc(text)}</td>`;
        }).join("");
        return `<tr${cls ? ` class="${cls}"` : ""}>${cells}</tr>`;
      }).join("");
      return `<div class="pv-wrap"><table class="pv-table">${rows}</table></div>`;
    }
    const tokens = [...(hl.text.get(bi) || [])];
    return b.text.split(/\n{2,}/).filter((para) => !/^[\s•·●◦▪-]*$/.test(para)).map((para) => {
      const cap = /^(Table|Units):/.test(para.trim());
      let html = esc(para.replace(/^#+\s*/gm, "").replace(/\*\*/g, ""));
      for (const tok of tokens) {
        html = html.replace(new RegExp(`(?<![\\d,.])${reEsc(esc(tok))}(?![\\d,]|\\.\\d)`, "g"), (m) => `<mark class="hl" data-b="${bi}">${m}</mark>`);
      }
      return `<p class="pv-text${cap ? " cap" : ""}">${html}</p>`;
    }).join("");
  }).join("");
}

function openPassage(id, n) {
  const d = document.getElementById(`d-${id}`);
  if (d) d.open = true;
  const pv = document.getElementById(`p-${id}-${n}`);
  if (pv) pv.open = true;
  return pv;
}

function flash(el) {
  el.classList.remove("focus");
  void el.offsetWidth;               // restart the animation
  el.classList.add("focus");
  setTimeout(() => el.classList.remove("focus"), 1700);
}

function showNumber(key) {
  const [id, k] = key.split(":");
  const e = history.find((h) => h.id === id);
  const n = e && e.res && (e.res.numbers || [])[+k];
  if (!n) return;
  const targets = [];
  for (const c of n.cells) {
    openPassage(id, c.source);
    const el = document.getElementById(`c-${id}-${c.source}-${c.block}-${c.row}-${c.col}`);
    if (el) targets.push(el);
  }
  for (const t of n.text) {
    const pv = openPassage(id, t.source);
    pv?.querySelectorAll(`mark.hl[data-b="${t.block}"]`).forEach((m) => { if (m.textContent === t.token) targets.push(m); });
  }
  if (!targets.length) return;
  targets[0].scrollIntoView({ block: "center", behavior: "smooth" });
  targets.forEach(flash);
}

// ------------------------------------------------------------ asking
function errorText(status, body) {
  const d = body && body.detail;
  if (status === 422) return "Questions must be between 3 and 1,000 characters.";
  if (status === 503) return typeof d === "string" && d.startsWith("busy")
    ? "The server is busy with other questions. Try again in a moment."
    : "The models are still loading. Try again in a minute.";
  if (status === 504) return "The answer took too long and was stopped.";
  return typeof d === "string" ? d : `Request failed (HTTP ${status}).`;
}

async function ask(q, decompose) {
  q = q.trim();
  if (q.length < 3 || busy) return;
  busy = true; updateComposer();
  pending = { id: Date.now().toString(36), q, decompose, ts: Date.now(), pending: true };
  render();
  document.getElementById(`t-${pending.id}`).scrollIntoView({ block: "end" });
  const tick = setInterval(() => {
    const el = $("elapsed");
    if (el) el.textContent = Math.floor((Date.now() - pending.ts) / 1000);
  }, 1000);

  const entry = { id: pending.id, q, decompose, ts: pending.ts };
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 320000);
  try {
    const r = await fetch("/query", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, decompose }), signal: ctrl.signal,
    });
    const body = await r.json().catch(() => ({}));
    if (r.ok) entry.res = body; else entry.err = errorText(r.status, body);
  } catch (err) {
    entry.err = err.name === "AbortError" ? "No answer after 5 minutes." : "Couldn't reach the API. Is the container running?";
  }
  clearTimeout(timeout); clearInterval(tick);
  pending = null; busy = false;
  history.push(entry); saveHistory(); render(); updateComposer();
  document.getElementById(`t-${entry.id}`).scrollIntoView({ block: "start" });
  input.focus();
}

function updateComposer() {
  const n = input.value.length;
  send.disabled = busy || !ready || input.value.trim().length < 3;
  send.title = !ready ? "The pipeline isn't ready yet" : busy ? "Waiting for the current answer" : "";
  const count = $("count");
  count.textContent = n > 800 ? `${n}/${MAX_CHARS} · ` : "";
  count.className = n >= MAX_CHARS ? "over" : "";
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

// ------------------------------------------------------------ health
async function checkHealth() {
  let state = "bad", text = "API unreachable", tip = "";
  try {
    const r = await fetch("/health", { cache: "no-store" });
    const h = await r.json();
    if (r.ok && h.pipeline_ready) {
      state = "ok"; text = `Ready · ${Number(h.qdrant?.points || 0).toLocaleString("en-US")} chunks`;
    } else if (h.startup_error) {
      text = "Startup failed"; tip = h.startup_error;
    } else if (!h.pipeline_ready) {
      state = "warn"; text = "Loading models…";
    } else {
      state = "warn"; text = !h.ollama?.ok ? "LLM unavailable" : "Vector DB unavailable";
    }
  } catch { /* unreachable */ }
  ready = state === "ok";
  $("dot").className = "dot " + state;
  $("status-text").textContent = text;
  $("status").title = tip;
  updateComposer();
  setTimeout(checkHealth, ready ? 30000 : 4000);
}

// ------------------------------------------------------------ events
$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (send.disabled) return;
  const q = input.value;
  input.value = "";
  ask(q, $("split").checked);
});
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});
input.addEventListener("input", updateComposer);

log.addEventListener("click", (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.q) { input.value = t.dataset.q; updateComposer(); input.focus(); }
  else if (t.dataset.num) showNumber(t.dataset.num);
  else if (t.dataset.src) {
    const card = document.getElementById(t.dataset.src);
    card.closest("details").open = true;
    const [, id, n] = t.dataset.src.split("-");
    const first = openPassage(id, n)?.querySelector(".hl");
    (first || card).scrollIntoView({ block: first ? "center" : "nearest", behavior: "smooth" });
    card.classList.add("flash");
    setTimeout(() => card.classList.remove("flash"), 1400);
    if (first) flash(first);
  } else if (t.dataset.copy) {
    navigator.clipboard?.writeText(t.dataset.copy).then(() => {
      const old = t.textContent; t.textContent = "trace id copied"; setTimeout(() => (t.textContent = old), 1200);
    }).catch(() => {});
  } else if (t.dataset.retry) {
    const i = history.findIndex((e) => e.id === t.dataset.retry);
    if (i < 0 || busy) return;
    const [e] = history.splice(i, 1);
    saveHistory();
    ask(e.q, e.decompose);
  }
});

$("clear").addEventListener("click", () => {
  if (busy || !history.length || !confirm("Clear the whole conversation?")) return;
  history = []; saveHistory(); render();
});

loadHistory();
render();
checkHealth();
input.focus();
</script>
