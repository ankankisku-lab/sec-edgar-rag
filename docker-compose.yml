# Default (`docker compose up -d`): infrastructure only -- Qdrant + Phoenix -- for native development.
# Full stack (`docker compose --profile app up -d`): + Ollama (LLM) + the API, both on the GPU.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1        # pinned: server and qdrant-client versions should match
    container_name: sec-rag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"          # REST (localhost only)
      - "127.0.0.1:6334:6334"          # gRPC
    volumes:
      # Named volume, not a Windows bind mount: Qdrant warns that Windows-mounted
      # folders can corrupt its storage. The volume lives in Docker's disk image,
      # which is on D:\DockerData.
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    mem_limit: 3g                      # keep headroom on a 16 GB laptop

  phoenix:
    image: arizephoenix/phoenix:version-20.16.0   # pinned; open-source, runs fully locally
    container_name: sec-rag-phoenix
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"          # UI + OTLP/HTTP trace ingest (/v1/traces)
    volumes:
      - phoenix_data:/mnt/data         # traces persist across restarts (SQLite in the volume)
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_TELEMETRY_ENABLED: "false"
    mem_limit: 1g

  ollama:
    profiles: ["app"]
    image: ollama/ollama:0.34.4        # same version as the portable install used natively
    container_name: sec-rag-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./models/ollama:/root/.ollama/models      # models already downloaded on D:, not re-pulled
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_CONTEXT_LENGTH: "8192"    # OpenAI-compatible calls can't set num_ctx
      OLLAMA_NUM_PARALLEL: "1"         # parallel slots multiply KV-cache memory
      OLLAMA_MAX_LOADED_MODELS: "1"
      LLAMA_ARG_CACHE_RAM: "0"         # llama-server's RAM prompt cache (8 GiB default) got the runner OOM-killed
      OLLAMA_KEEP_ALIVE: "-1"         # keep Qwen loaded while the stack runs (a reload costs ~60 s)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sec-edgar-rag-api:1.0
    container_name: sec-rag-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      phoenix:
        condition: service_started
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: ollama:11434
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      LLM_KEEP_ALIVE: 24h              # requests carry keep_alive (10m natively); don't unload between questions
    volumes:
      - ./models:/models                           # embedder, reranker, BM25 caches (offline)
      - ./data/index:/app/data/index               # parent store, opened read-only + immutable
      - ./data/eval/cache:/app/data/eval/cache     # decomposition cache (router + LLM results)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qdrant_storage:
    name: sec-rag-qdrant-storage
  phoenix_data:
    name: sec-rag-phoenix-data
